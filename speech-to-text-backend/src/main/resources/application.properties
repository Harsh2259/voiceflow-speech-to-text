# ===================================================================
# Application Configuration
# ===================================================================
spring.application.name=transcription-backend
server.port=8080


# ===================================================================
# MySQL 8+ Database Configuration
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/transcription_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci

spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===================================================================
# JPA & Hibernate Configuration
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


# ===================================================================
# HTTP / UTF-8 Character Encoding
# ===================================================================
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true


# ===================================================================
# Multipart / File Upload Configuration
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ===================================================================
# Logging Configuration
# ===================================================================
logging.level.root=INFO
logging.level.com.procucev.transcriptionbackend=INFO
logging.level.org.springframework.web.socket=INFO


# ===================================================================
# Server Configuration
# ===================================================================
server.tomcat.uri-encoding=UTF-8